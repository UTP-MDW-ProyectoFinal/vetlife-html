<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="Panel administrativo de VetLife" name="description" />
    <title>Gestión de citas | VetLife</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
    <link href="../assets/css/estilos.css" rel="stylesheet" />
</head>

<body class="admin-fondo" data-admin-pagina="citas" data-requiere="administrador">
    <div class="d-flex admin-layout">
        <aside class="admin-sidebar d-flex flex-column flex-shrink-0 p-3" id="barraLateralAdmin">
            <a class="d-flex align-items-center gap-2 text-white mb-4" href="dashboard.html">
                <span class="fw-bold">
                    VetLife
                </span>
            </a>
            <nav aria-label="Men&uacute; administrativo">
                <ul class="nav nav-pills flex-column gap-1">
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" data-pagina-nav="admin-dashboard"
                            href="dashboard.html">
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 active"
                            data-pagina-nav="admin-citas" href="gestion-citas.html">
                            Citas
                        </a>
                    </li>
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" data-pagina-nav="admin-pacientes"
                            href="pacientes.html">
                            Pacientes
                        </a>
                    </li>
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" data-pagina-nav="admin-servicios"
                            href="gestion-servicios.html">
                            Servicios
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="mt-auto pt-3 border-top border-secondary-subtle">
                <a class="nav-link px-3 py-2" href="../index.html">
                    Ir al sitio web
                </a>
            </div>
        </aside>
        <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none superposicion-admin"
            id="superposicionAdmin">
        </div>
        <div class="admin-contenido d-flex flex-column">
            <header class="admin-barra d-flex align-items-center justify-content-between px-3 px-lg-4 sticky-top">
                <button aria-label="Abrir men&uacute;" class="btn btn-light border d-md-none" id="botonMenuAdmin"
                    type="button">Menú</button>
                <div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span
                        class="avatar-admin rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fw-bold">
                        DR
                    </span>
                    <div class="d-none d-sm-block">
                        <div class="small fw-semibold">
                            Dra. Ram&iacute;rez
                        </div>
                        <div class="small text-secondary">
                            Administrador
                        </div>
                    </div>
                </div>
            </header>
            <main class="container-fluid p-4 p-lg-5">
                <header class="mb-4">
                    <h1 class="display-6 font-heading">
                        Gesti&oacute;n de citas
                    </h1>
                    <p class="text-secondary mb-0">
                        Filtra y consulta las citas registradas.
                    </p>
                </header>
                <div class="row g-4">
                    <section class="col-xl-8">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <div class="d-flex flex-column flex-lg-row gap-2 justify-content-between mb-3">
                                    <div class="d-flex flex-wrap gap-2">
                                        <button class="btn btn-sm btn-primary" data-filtro-cita="todas">
                                            Todas
                                        </button>
                                        <button class="btn btn-sm btn-outline-primary" data-filtro-cita="pendiente">
                                            Pendientes
                                        </button>
                                        <button class="btn btn-sm btn-outline-primary" data-filtro-cita="confirmada">
                                            Confirmadas
                                        </button>
                                        <button class="btn btn-sm btn-outline-primary" data-filtro-cita="completada">
                                            Completadas
                                        </button>
                                        <button class="btn btn-sm btn-outline-primary" data-filtro-cita="cancelada">
                                            Canceladas
                                        </button>
                                    </div>
                                    <input class="form-control ancho-buscador-citas" id="buscarCita"
                                        placeholder="Buscar paciente, propietario o servicio" />
                                </div>
                                <div class="table-responsive">
                                    <table class="table align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th>
                                                    ID
                                                </th>
                                                <th>
                                                    Fecha
                                                </th>
                                                <th>
                                                    Hora
                                                </th>
                                                <th>
                                                    Paciente
                                                </th>
                                                <th>
                                                    Servicio
                                                </th>
                                                <th>
                                                    Veterinario
                                                </th>
                                                <th>
                                                    Estado
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody id="cuerpoTablaCitas">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </section>
                    <aside class="col-xl-4">
                        <div class="card shadow-sm detalle-panel p-4 d-none" id="detalleCita">
                        </div>
                    </aside>
                </div>
            </main>
        </div>
    </div>
    <div class="position-fixed end-0 bottom-0 m-3" id="contenedorToast">
    </div>
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
    <script src="../assets/js/datos.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/autenticacion.js"></script>
    <script src="../assets/js/administrador.js"></script>
    <script src="../assets/js/app.js"></script>
</body>

</html>
