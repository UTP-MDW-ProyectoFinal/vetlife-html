<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="Panel administrativo de VetLife" name="description" />
    <title>
        Panel Administrativo | Vetlife
    </title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="../assets/css/estilos.css" rel="stylesheet" />
</head>

<body class="admin-fondo" data-admin-pagina="dashboard" data-requiere="administrador">
    <div class="d-flex admin-layout">
        <aside class="admin-sidebar d-flex flex-column flex-shrink-0 p-3" id="barraLateralAdmin">
            <a class="d-flex align-items-center gap-2 text-white mb-4" href="dashboard.html">
                <span class="brand-logo logo-admin">
                    <i class="bi bi-heart-pulse-fill">
                    </i>
                </span>
                <span class="fw-bold">
                    VetLife
                </span>
            </a>
            <nav aria-label="Men&uacute; administrativo">
                <ul class="nav nav-pills flex-column gap-1">
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 active"
                            data-pagina-nav="admin-dashboard" href="dashboard.html">
                            <i class="bi bi-speedometer2">
                            </i>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" data-pagina-nav="admin-citas"
                            href="citas.html">
                            <i class="bi bi-calendar-check">
                            </i>
                            Citas
                        </a>
                    </li>
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" data-pagina-nav="admin-pacientes"
                            href="pacientes.html">
                            <i class="bi bi-heart-pulse">
                            </i>
                            Pacientes
                        </a>
                    </li>
                    <li>
                        <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" data-pagina-nav="admin-servicios"
                            href="servicios.html">
                            <i class="bi bi-clipboard2-pulse">
                            </i>
                            Servicios
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="mt-auto pt-3 border-top border-secondary-subtle">
                <a class="nav-link px-3 py-2" href="../index.html">
                    <i class="bi bi-box-arrow-up-right me-2">
                    </i>
                    Ir al sitio web
                </a>
            </div>
        </aside>
        <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none superposicion-admin"
            id="superposicionAdmin">
        </div>
        <div class="admin-contenido d-flex flex-column">
            <header class="admin-barra d-flex align-items-center justify-content-between px-3 px-lg-4 sticky-top">
                <button aria-label="Abrir men&uacute;" class="btn btn-light border d-md-none" id="botonMenuAdmin"
                    type="button">
                    <i class="bi bi-list">
                    </i>
                </button>
                <div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span
                        class="avatar-admin rounded-circle bg-principal-suave text-principal d-inline-flex align-items-center justify-content-center fw-bold">
                        DR
                    </span>
                    <div class="d-none d-sm-block">
                        <div class="small fw-semibold">
                            Dra. Ram&iacute;rez
                        </div>
                        <div class="small text-secondary">
                            Administrador
                        </div>
                    </div>
                </div>
            </header>
            <main class="container-fluid p-4 p-lg-5">
                <header class="mb-4">
                    <p class="small text-secondary text-capitalize mb-2" id="fechaAdministrador">
                    </p>
                    <h1 class="display-6 font-heading">
                        Panel administrativo
                    </h1>
                    <p class="text-secondary mb-0">
                        Resumen general de la operaci&oacute;n de VetLife.
                    </p>
                </header>
                <section>
                    <div class="row g-3 mb-4" id="resumenAdmin">
                    </div>
                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="card tarjeta-vet">
                                <div class="card-body p-0">
                                    <div class="p-4 border-bottom border-vet">
                                        <h2 class="h5 font-heading mb-0">
                                            Agenda reciente
                                        </h2>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table tabla-vet mb-0">
                                            <thead>
                                                <tr>
                                                    <th>
                                                        Hora
                                                    </th>
                                                    <th>
                                                        Paciente
                                                    </th>
                                                    <th>
                                                        Servicio
                                                    </th>
                                                    <th>
                                                        Estado
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody id="agendaAdmin">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <aside class="col-lg-4">
                            <div class="card tarjeta-vet h-100">
                                <div class="card-body p-4">
                                    <h2 class="h5 font-heading">
                                        Accesos r&aacute;pidos
                                    </h2>
                                    <div class="d-grid gap-2 mt-3">
                                        <a class="btn btn-vet-soft text-start" href="citas.html">
                                            <i class="bi bi-calendar-check me-2">
                                            </i>
                                            Gestionar citas
                                        </a>
                                        <a class="btn btn-vet-soft text-start" href="pacientes.html">
                                            <i class="bi bi-heart-pulse me-2">
                                            </i>
                                            Consultar pacientes
                                        </a>
                                        <a class="btn btn-vet-soft text-start" href="servicios.html">
                                            <i class="bi bi-clipboard2-pulse me-2">
                                            </i>
                                            Gestionar servicios
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </aside>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <div class="toast-vet" id="contenedorToast">
    </div>
    <script crossorigin="anonymous" integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYjR+WVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
    <script src="../assets/js/datos.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/autenticacion.js"></script>
    <script src="../assets/js/servicios.js"></script>
    <script src="../assets/js/administrador.js"></script>
    <script src="../assets/js/app.js"></script>
</body>

</html>
